# Configuracao do Checkov (usada local e no CI).
# Cada skip tem justificativa; o restante FALHA o pipeline.
compact: true
quiet: true
skip-path:
  - .terraform
  - .venv
soft-fail: false

skip-check:
  # --- Terraform: custo/escopo do desafio (todas tem variavel para inverter) ---
  - CKV_AWS_157  # RDS Multi-AZ: dobra o custo; var db_multi_az
  - CKV_AWS_293  # RDS deletion protection: desafio exige destroy limpo; var db_deletion_protection
  - CKV_AWS_118  # RDS enhanced monitoring: custo CloudWatch; metricas via postgres_exporter
  - CKV_AWS_353  # RDS Performance Insights: nao suportado em db.t4g.micro
  - CKV_AWS_136  # ECR com KMS: AES256 gerenciado e suficiente; KMS = custo por chave/req
  - CKV_AWS_145  # S3 state com KMS: SSE-S3 + TLS obrigatorio + bloqueio publico; sem CMK por custo
  - CKV_AWS_144  # S3 state cross-region replication: sem requisito de DR multi-regiao
  - CKV_AWS_18   # S3 state access logging: gera outro bucket + custo; CloudTrail cobre
  - CKV2_AWS_62  # S3 state event notifications: sem consumidor
  - CKV_TF_1     # modulos do registry pinados por versao semantica (nao por commit hash)

  # --- Kubernetes: decisoes deliberadas e documentadas ---
  - CKV_K8S_43   # imagem por digest: tag sha-<commit> em ECR IMMUTABLE da a mesma garantia
  - CKV_K8S_15   # pullPolicy Always: desnecessario com tags imutaveis
  - CKV_K8S_11   # CPU limit: omitido de proposito para evitar throttling; HPA usa requests
  - CKV_K8S_35   # secrets como env var: 12-factor; Secret vem do ESO, sem arquivo no pod

# Valores padrao. Sobrescreva por ambiente com -f values-<env>.yaml ou --set.

image:
  repository: 208597681536.dkr.ecr.us-east-1.amazonaws.com/comments-api
  tag: ""            # obrigatorio: sha-<commit> (o pipeline preenche)
  pullPolicy: IfNotPresent

replicaCount: 2

# --- banco (host/db vem dos outputs do Terraform; credenciais do Secrets Manager) ---
database:
  host: ""           # ex.: comments-api-dev.xxxx.us-east-1.rds.amazonaws.com
  port: 5432
  name: commentsdb
  secretArn: ""      # arn:aws:secretsmanager:...:secret:rds!db-...
  poolSize: 5
  maxOverflow: 5

externalSecret:
  storeName: aws-secrets-manager
  refreshInterval: 1h

env:
  APP_ENV: prod
  LOG_LEVEL: INFO

service:
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: alb
  host: ""           # vazio = responde por qualquer host (usa o DNS do ALB)
  annotations:
    # IngressGroup: um unico ALB compartilhado por Ingresses de varios namespaces
    # (Grafana em /grafana entra no mesmo grupo). Sem custo de um 2o ALB.
    alb.ingress.kubernetes.io/group.name: comments-api
    alb.ingress.kubernetes.io/group.order: "100"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi   # sem limit de CPU: evita throttling; HPA usa requests

probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  startup:
    path: /health
    periodSeconds: 2
    failureThreshold: 15   # ate 30s para subir

# Drena conexoes do ALB antes do SIGTERM
terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5

migration:
  enabled: true
  backoffLimit: 2
  activeDeadlineSeconds: 300

serviceAccount:
  create: true
  annotations: {}    # sem role IAM: a app nao chama APIs da AWS

podAnnotations: {}
nodeSelector: {}
tolerations: []

# --- resiliencia ---
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
  scaleDownStabilizationSeconds: 300

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Espalha pods entre AZs; ScheduleAnyway evita Pending se uma AZ ficar sem no
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway

networkPolicy:
  enabled: true
  vpcCidr: 10.0.0.0/16
  monitoringNamespace: monitoring

# --- observabilidade ---
metrics:
  serviceMonitor:
    enabled: true
    interval: 30s

# Metricas do RDS "do lado do servidor" (conexoes, commits, locks)
postgresExporter:
  enabled: true
  image:
    repository: quay.io/prometheuscommunity/postgres-exporter
    tag: v0.20.1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

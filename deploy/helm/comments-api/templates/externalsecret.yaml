# Le username/password do secret gerenciado pelo RDS e monta a DATABASE_URL.
# Host/porta/db nao sao segredo: vem dos values (outputs do Terraform).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "comments-api.dbSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "comments-api.labels" . | nindent 4 }}
  annotations:
    # criado antes do Job de migracao (hook-weight menor) e mantido apos o hook
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName }}
  target:
    name: {{ include "comments-api.dbSecretName" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql+asyncpg://{{ printf "{{ .username }}" }}:{{ printf "{{ .password }}" }}@{{ required "database.host e obrigatorio" .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "database.secretArn e obrigatorio" .Values.database.secretArn | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.database.secretArn | quote }}
        property: password

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "comments-api.fullname" . }}
  labels:
    {{- include "comments-api.labels" . | nindent 4 }}
  annotations:
    # criado antes do Job de migracao (hook-weight menor) e mantido apos o hook
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  DB_POOL_SIZE: {{ .Values.database.poolSize | quote }}
  DB_MAX_OVERFLOW: {{ .Values.database.maxOverflow | quote }}
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}

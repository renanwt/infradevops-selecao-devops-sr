services:
  postgres:
    image: postgres:16-alpine
    container_name: comments-postgres
    environment:
      POSTGRES_USER: comments
      POSTGRES_PASSWORD: comments
      POSTGRES_DB: comments
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comments -d comments"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

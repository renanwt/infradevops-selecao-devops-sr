name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write # upload de SARIF (Security tab)
  id-token: write        # OIDC para o push no ECR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CHART_DIR: deploy/helm/comments-api
  K8S_VERSION: "1.35.0"
  IMAGE_NAME: comments-api
  AWS_REGION: us-east-1

jobs:
  # ---------------------------------------------------------------------------
  lint-test:
    name: lint + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: comments
          POSTGRES_PASSWORD: comments
          POSTGRES_DB: comments
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U comments -d comments"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://comments:comments@localhost:5432/comments
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: pip install -e ".[dev]"

      - name: ruff (lint + format)
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: mypy
        run: mypy

      - name: alembic upgrade head
        run: alembic -c app/alembic.ini upgrade head

      - name: pytest (unit + integração)
        run: pytest --cov-report=xml --junitxml=junit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  chart:
    name: helm lint + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: helm lint
        run: |
          helm lint "$CHART_DIR" --strict \
            -f "$CHART_DIR/values-dev.yaml" --set image.tag=ci

      - name: helm template
        run: |
          helm template comments-api "$CHART_DIR" -n comments \
            -f "$CHART_DIR/values-dev.yaml" --set image.tag=ci > rendered.yaml
          echo "objetos renderizados: $(grep -c '^kind:' rendered.yaml)"

      # Valida os manifests contra os schemas da versao do cluster.
      # CRDs (ExternalSecret) vem do catalogo da datree.
      - uses: yokawasa/action-setup-kube-tools@v0.11.2
        with:
          kubeconform: "0.6.7"

      - name: kubeconform
        run: |
          kubeconform -strict -summary \
            -kubernetes-version "$K8S_VERSION" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered.yaml
          retention-days: 7

  # ---------------------------------------------------------------------------
  build:
    name: build image
    runs-on: ubuntu-latest
    needs: [lint-test]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: tag = sha-<7 chars>
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: build (sem push) + exporta tar para o scan
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 1

  # ---------------------------------------------------------------------------
  scan:
    name: scan (trivy + checkov)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp

      # --- Trivy: vulnerabilidades da imagem (falha em HIGH/CRITICAL corrigiveis) ---
      - name: trivy image (sarif)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          input: /tmp/image.tar
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: trivy image (gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          input: /tmp/image.tar
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # --- Trivy: misconfig em Dockerfile, Terraform e Helm ---
      - name: trivy config (gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          skip-dirs: .venv
          exit-code: "1"

      # --- Checkov: Terraform ---
      - name: checkov terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov-tf.sarif

      # --- Checkov: manifests renderizados + Dockerfile ---
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: render chart
        run: |
          mkdir -p .scan
          helm template comments-api "$CHART_DIR" -n comments \
            -f "$CHART_DIR/values-dev.yaml" --set image.tag=ci > .scan/rendered.yaml
          cp Dockerfile .scan/

      - name: checkov kubernetes + dockerfile
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .scan
          framework: kubernetes,dockerfile
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov-k8s.sarif

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-tf.sarif
          category: checkov-terraform

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-k8s.sarif
          category: checkov-kubernetes

  # ---------------------------------------------------------------------------
  # Publica no ECR EXATAMENTE a imagem que passou no scan (mesmo tar).
  # So em push na main: PRs param no scan.
  package:
    name: package (push ECR)
    runs-on: ubuntu-latest
    needs: [build, scan, chart]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.push.outputs.image }}
      tag: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: push
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          docker load -i /tmp/image.tar
          IMAGE="$REGISTRY/$IMAGE_NAME:$TAG"
          docker tag "$IMAGE_NAME:$TAG" "$IMAGE"
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          {
            echo "### imagem publicada"
            echo
            echo "\`$IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"

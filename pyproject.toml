[project]
name = "comments-api"
version = "0.1.0"
description = "API de Comentarios - desafio DevOps Sr (FastAPI + PostgreSQL/RDS + EKS)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Renan L. W. Teixeira" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy[asyncio]>=2.0.32,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "prometheus-client>=0.20,<1",
    "structlog>=24.4,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<7",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pre-commit>=3.8,<5",
    "psycopg[binary]>=3.2,<4",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff: lint + format (substitui flake8/isort/black)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit (seguranca)
    "N",        # pep8-naming
    "ASYNC",    # async pitfalls
    "RUF",
]
ignore = [
    "S101",     # assert em testes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # senhas hardcoded em fixtures de teste

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true

# ---------------------------------------------------------------------------
# pytest / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
markers = [
    "integration: testes que exigem PostgreSQL real",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/alembic/*"]

[tool.coverage.report]
fail_under = 60  # sobe para 80 quando os testes de integracao entrarem
show_missing = true
